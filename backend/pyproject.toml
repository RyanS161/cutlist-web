[project]
name = "cutlist-backend"
version = "0.1.0"
description = "ADK-based agentic backend for CadQuery woodworking carpenter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.7.0",
    "google-adk>=1.0.0",
    "ocp>=0.1.4",
    "python-dotenv>=1.0.0",
    "pyvista>=0.47.0",
]

[project.optional-dependencies]
# Install with: uv pip install -e ".[extensions]"
# Enables OpenAI, Anthropic-direct, Groq, and 100+ other models via LiteLLM
extensions = [
    "litellm>=1.75.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
